# CI: contract tests + svelte-check + SPA build. Pin policy: .project/slsa/controls.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pin-check:
    name: action-pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if GitHub Actions are not SHA-pinned
        run: |
          set -euo pipefail
          unpinned="$(grep -REn --include='*.yml' --include='*.yaml' \
            'uses:[[:space:]]*[^[:space:]#]+@[^[:space:]#]+' .github/workflows \
            | grep -Ev '@[0-9a-f]{40}([[:space:]]|#|$)' \
            | grep -Ev 'uses:[[:space:]]*\./' || true)"
          if [ -n "$unpinned" ]; then
            printf '%s\n' "$unpinned"
            echo "::error::GitHub Actions must be pinned by full commit SHA (see .project/slsa/controls.md)"
            exit 1
          fi
          echo "All workflow uses: refs are 40-char SHAs."

  chat-web:
    name: chat-web
    runs-on: ubuntu-latest
    needs: pin-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Page contract tests
        run: npm test

      - name: svelte-check
        run: npm run check --workspace=@buildytech/chat-web

      - name: Build
        run: npm run build --workspace=@buildytech/chat-web

  context-serve:
    name: context-serve
    runs-on: ubuntu-latest
    needs: pin-check
    defaults:
      run:
        working-directory: services/context-serve
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: services/context-serve/go.mod
          cache-dependency-path: services/context-serve/go.sum

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o context-serve .
