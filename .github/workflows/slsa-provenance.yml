# P0 SLSA control path: hosted GHA build + artefact provenance (toward Build L2).
# See .project/slsa/controls.md and ADR 0002.
name: SLSA provenance

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: slsa-provenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    name: chat-web provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/chat-web/package.json

      - name: Install
        working-directory: apps/chat-web
        run: npm install

      - name: Build static SPA
        working-directory: apps/chat-web
        run: npm run build

      - name: Package subject tarball
        run: |
          set -euo pipefail
          test -d apps/chat-web/build
          sha="$(git rev-parse --short HEAD)"
          tar -C apps/chat-web -czf "chat-web-spa-${sha}.tgz" build
          echo "SUBJECT=chat-web-spa-${sha}.tgz" >> "$GITHUB_ENV"
          sha256sum "chat-web-spa-${sha}.tgz"

      - name: Upload build artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chat-web-spa
          path: ${{ env.SUBJECT }}
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.SUBJECT }}
