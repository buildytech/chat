# Protected xAI runtime only. Not a live Grok claim by itself.
services:
  xai-runtime:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ../../:/app
    environment:
      XAI_API_KEY: ${XAI_API_KEY:-}
      BUILDY_RUNTIME_BIND: ${BUILDY_RUNTIME_BIND:-127.0.0.1}
      BUILDY_RUNTIME_PORT: "18100"
      BUILDY_RUNTIME_BASIC_AUTH_USER: ${BUILDY_RUNTIME_BASIC_AUTH_USER:-}
      BUILDY_RUNTIME_BASIC_AUTH_PASSWORD: ${BUILDY_RUNTIME_BASIC_AUTH_PASSWORD:-}
    command:
      - bash
      - -lc
      - node --experimental-strip-types apps/xai-runtime/src/server.ts
    ports:
      - "127.0.0.1:18100:18100"
