# /etc/systemd/journald.conf.d/site.conf
# Short journal retention for the site host (see PRIVACY.md). journald has no
# per-unit retention, so this applies to the whole machine/container; keep it
# short in a container that only runs the site.
[Journal]
Storage=persistent
MaxRetentionSec=7day
SystemMaxUse=200M
RateLimitIntervalSec=30s
RateLimitBurst=1000
